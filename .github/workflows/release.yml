name: Build release artifacts

# Three ways to start a release:
#   - a commit lands on main: the next release tag is worked out and created
#     automatically (see .github/scripts/next-release-tag.sh);
#   - a manual run from the Actions tab: same as above, or a build-only run
#     when "publish" is unticked;
#   - a tag pushed by hand: that tag is released as is.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Create the next release tag and publish a release. Untick to only
          build: nothing is tagged or released, and the packages are attached
          to the workflow run instead.
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

# One release at a time. Two runs working out the next tag in parallel would
# pick the same number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      ref: ${{ steps.release.outputs.ref }}
      publish: ${{ steps.release.outputs.publish }}
      skip: ${{ steps.release.outputs.skip }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # The next tag is derived from the existing ones; a full fetch
          # brings every tag along.
          fetch-depth: 0

      - name: Work out the release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail

          skip=false

          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            # A tag pushed by hand is released under its own name.
            tag="$GITHUB_REF_NAME"
            ref="refs/tags/$tag"
          else
            next="$(bash .github/scripts/next-release-tag.sh "$GITHUB_SHA")"
            tag="$(sed -n 's/^tag=//p' <<< "$next")"
            existing="$(sed -n 's/^existing=//p' <<< "$next")"
            ref="$GITHUB_SHA"

            if [[ "$PUBLISH" == 'true' ]]; then
              ref="refs/tags/$tag"

              if [[ "$existing" == 'true' ]]; then
                # This commit was tagged by an earlier run. Finish that release
                # if it is still a draft; if it is already out there is nothing
                # left to do.
                if [[ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null)" == 'false' ]]; then
                  echo "::notice::$GITHUB_SHA is already released as $tag."
                  skip=true
                fi
              else
                # Tags created with the workflow token do not start another
                # run, so this does not trigger the tag push event above.
                gh api "repos/$GITHUB_REPOSITORY/git/refs" \
                  -f "ref=refs/tags/$tag" \
                  -f "sha=$GITHUB_SHA" > /dev/null
                echo "Created tag $tag at $GITHUB_SHA."
              fi
            fi
          fi

          {
            echo "tag=$tag"
            echo "ref=$ref"
            echo "publish=$PUBLISH"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"

          echo "Release tag: $tag (publish: $PUBLISH, skip: $skip)"

  create-draft-release:
    name: Create draft release
    needs: prepare
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Create or resume draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          if is_draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$is_draft" != 'true' ]]; then
              echo "Release $RELEASE_TAG is already published and cannot be changed." >&2
              exit 1
            fi
            echo "Draft release $RELEASE_TAG already exists; resuming asset upload."
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --generate-notes --verify-tag
          fi

  build-and-attest:
    name: ${{ matrix.name }}
    needs:
      - prepare
      - create-draft-release
    # A build-only run has no draft release, so that job is skipped; build
    # anyway unless it failed or this commit is already released.
    if: >-
      !cancelled()
      && needs.prepare.result == 'success'
      && needs.prepare.outputs.skip != 'true'
      && (needs.create-draft-release.result == 'success' || needs.create-draft-release.result == 'skipped')
    runs-on: ${{ matrix.os }}
    # electron-builder launches a separate `npm rebuild` while packaging.
    # These settings must therefore apply to every step, not only `npm ci`.
    env:
      npm_config_python: python
      npm_config_node_gyp: ${{ github.workspace }}/node_modules/node-gyp/bin/node-gyp.js
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            package-command: package-linux
            attestation-subject-path: |
              target/*.AppImage
              target/*.deb
              target/*.tar.gz
          - name: Windows
            # Node 14's bundled node-gyp cannot detect newer Visual Studio.
            # windows-2022 provides VS 2022 for the project node-gyp below.
            os: windows-2022
            package-command: package-windows
            attestation-subject-path: target/*.exe
          - name: macOS
            # macos-13 is no longer available as a standard hosted image.
            # Use the current Intel image so the release remains compatible
            # with existing x64 macOS installations.
            os: macos-15-intel
            package-command: package-mac
            attestation-subject-path: target/*.dmg

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          # The release tag, or the commit itself on a build-only run.
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Python for node-gyp
        uses: actions/setup-python@v5
        with:
          # Node 14 ships npm/node-gyp 5, which uses Python's removed `rU`
          # file mode and therefore is incompatible with Python 3.11+.
          python-version: '3.10'

      - name: Install dependencies
        run: npm ci

      - name: Set the application version
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: npm --no-git-tag-version version "$RELEASE_TAG"

      - name: Build application
        run: npm run build-release

      - name: Prepare macOS signing and notarization credentials
        if: matrix.name == 'macOS'
        id: macos-credentials
        shell: bash
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          signing=no
          notarization=no

          if [[ -n "$MACOS_CSC_LINK" || -n "$MACOS_CSC_KEY_PASSWORD" ]]; then
            if [[ -z "$MACOS_CSC_LINK" || -z "$MACOS_CSC_KEY_PASSWORD" ]]; then
              echo 'Incomplete macOS signing credentials.' >&2
              exit 1
            fi
            signing=yes
          fi

          if [[ -n "$APPLE_API_KEY_P8" || -n "$APPLE_API_KEY_ID" || -n "$APPLE_API_ISSUER" ]]; then
            if [[ -z "$APPLE_API_KEY_P8" || -z "$APPLE_API_KEY_ID" || -z "$APPLE_API_ISSUER" ]]; then
              echo 'Incomplete Apple notarization credentials.' >&2
              exit 1
            fi
            notarization=yes
          fi

          if [[ "$notarization" == yes && "$signing" != yes ]]; then
            echo 'Apple notarization requires a signed Developer ID Application build.' >&2
            exit 1
          fi

          if [[ "$notarization" == yes ]]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_P8" | base64 -D > "$key_path"
            chmod 600 "$key_path"
            echo "apple-api-key=$key_path" >> "$GITHUB_OUTPUT"
          fi

          echo "signing=$signing" >> "$GITHUB_OUTPUT"
          echo "notarization=$notarization" >> "$GITHUB_OUTPUT"

          echo "macOS signing: $signing"
          echo "macOS notarization: $notarization"

      - name: Package application
        if: matrix.name != 'macOS'
        run: npm run ${{ matrix.package-command }}

      - name: Package unsigned macOS application
        if: matrix.name == 'macOS' && steps.macos-credentials.outputs.signing == 'no'
        run: npm run package-mac

      - name: Package signed macOS application
        if: matrix.name == 'macOS' && steps.macos-credentials.outputs.signing == 'yes'
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ steps.macos-credentials.outputs.apple-api-key }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run package-mac

      - name: Verify macOS application signature
        if: matrix.name == 'macOS' && steps.macos-credentials.outputs.signing == 'yes'
        shell: bash
        run: |
          app_path="$(find target -type d -name 'Cattr.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo 'Packaged Cattr.app was not found.' >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          signature_details="$(codesign --display --verbose=4 "$app_path" 2>&1)"
          signing_authority="$(printf '%s\n' "$signature_details" | sed -n '/^Authority=/{s/^Authority=//;p;q;}')"
          if [[ "$signing_authority" != "Developer ID Application: "* ]]; then
            echo "Unexpected macOS signing authority: ${signing_authority:-missing} (expected Developer ID Application)." >&2
            exit 1
          fi

      - name: Validate macOS notarization ticket
        if: matrix.name == 'macOS' && steps.macos-credentials.outputs.notarization == 'yes'
        shell: bash
        run: |
          app_path="$(find target -type d -name 'Cattr.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo 'Packaged Cattr.app was not found.' >&2
            exit 1
          fi
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"

      - name: Attest build provenance
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/attest@v4
        with:
          subject-path: ${{ matrix.attestation-subject-path }}

      - name: Attach packages to the workflow run
        if: needs.prepare.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.attestation-subject-path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload release assets to draft
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(${{ matrix.attestation-subject-path }})
          if (( ${#assets[@]} == 0 )); then
            echo 'No release assets were found.' >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            echo "Uploading ${asset}..."
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "$asset" &
            upload_pid=$!
            while kill -0 "$upload_pid" 2>/dev/null; do
              echo "$(date -u +%FT%TZ) Upload in progress: ${asset}"
              sleep 30
            done
            wait "$upload_pid"
            echo "Uploaded ${asset}."
          done

  publish-release:
    name: Publish release
    needs:
      - prepare
      - build-and-attest
    # build-and-attest has a custom condition, so its result has to be checked
    # here explicitly: a failed build must leave the release as a draft.
    if: >-
      !cancelled()
      && needs.build-and-attest.result == 'success'
      && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
